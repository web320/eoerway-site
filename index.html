<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>💙 EOERWAY | 마음의 길 위에서</title>
  <meta name="description" content="EOERWAY는 AI 심리치료와 감정회복 여정을 위한 공간입니다." />
  <meta name="google-adsense-account" content="ca-pub-1234567890" />

  <style>
    /* 기본 스타일 */
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap');

    body {
      margin: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(to bottom, #f9f9ff, #f2f3ff);
      color: #333;
      transition: background 0.5s, color 0.5s;
      overflow-x: hidden;
      line-height: 1.7;
      font-size: 16px;
      padding-bottom: 80px;
    }

    body.dark {
      background: linear-gradient(to bottom, #1b1c24, #232634);
      color: #eee;
    }

    header {
      text-align: center;
      padding: 1.5rem;
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    body.dark header {
      background: rgba(30,30,40,0.8);
      box-shadow: none;
    }

    header h1 {
      margin: 0 0 0.3rem 0;
      font-size: 2rem;
      color: #6a6aff;
    }

    nav {
      margin-top: 0.5rem;
    }

    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #6a6aff;
    }

    main {
      max-width: 900px;
      margin: 2rem auto 4rem auto;
      padding: 0 1rem;
    }

    section.page-section {
      display: none;
      animation: fadeIn 1.3s ease;
    }

    section.page-section.active {
      display: block;
    }

    h2 {
      font-size: 1.9rem;
      margin-bottom: 1rem;
      color: #3c3c8a;
    }

    body.dark h2 {
      color: #a2a2ff;
    }

    h3 {
      margin-top: 2.5rem;
      margin-bottom: 0.8rem;
      color: #555;
      font-weight: 700;
    }

    body.dark h3 {
      color: #ccc;
    }

    p {
      margin-bottom: 1.2rem;
      font-size: 1.1rem;
      white-space: pre-line;
    }

    a.button {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.8rem 1.8rem;
      background: #6a6aff;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.3s;
    }

    a.button:hover {
      background: #5959ff;
    }

    .ad-slot {
      background: rgba(0,0,0,0.05);
      padding: 1rem;
      margin-top: 3rem;
      border-radius: 8px;
      text-align: center;
      font-size: 0.9rem;
      color: #666;
    }

    body.dark .ad-slot {
      background: rgba(255,255,255,0.1);
      color: #bbb;
    }

    /* 구름 효과 */
    .clouds {
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 100%;
      background: url('https://cdn.pixabay.com/photo/2013/07/12/18/39/clouds-153232_1280.png') repeat-x;
      background-size: contain;
      opacity: 0.05;
      animation: moveClouds 80s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes moveClouds {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px);}
      to { opacity: 1; transform: translateY(0);}
    }

    #themeToggle, #musicToggle {
      position: fixed;
      top: 15px;
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      background: #ddd;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s, color 0.3s;
      z-index: 1001;
      user-select: none;
    }

    #themeToggle { right: 15px; }
    #musicToggle { right: 130px; }

    body.dark #themeToggle, body.dark #musicToggle {
      background: #444;
      color: #eee;
    }

    @media (max-width: 600px) {
      nav a {
        margin: 0 6px;
        font-size: 14px;
      }
      h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="clouds"></div>

  <!-- 🟦 자동 재생 음악 -->
  <audio id="bgm" src="https://example.com/music.mp3" loop></audio>

  <header>
    <h1>💙 EOERWAY</h1>
    <nav>
      <a onclick="showPage(1)">Home</a>
      <a onclick="showPage(2)">AI Therapy</a>
      <a onclick="showPage(3)">Mind Healing</a>
      <a onclick="showPage(4)">회복 스토리</a>
      <a onclick="showPage(5)">감정일기</a>
      <a onclick="showPage(6)">인생의 수용</a>
      <a onclick="showPage(7)">자기돌봄 루틴</a>
      <a onclick="showPage(8)">우울감 이해</a>
      <a onclick="showPage(9)">불안과 걱정</a>
      <a onclick="showPage(10)">외로움 다루기</a>
      <a onclick="showPage(11)">번아웃 회복</a>
      <a onclick="showPage(12)">마음 건강 식단</a>
      <a onclick="showPage(13)">수면</a>
      <a onclick="showPage(14)">관계</a>
      <a onclick="showPage(15)">성장 마인드셋</a>
    </nav>
  </header>

  <button id="musicToggle">🔈 음악 끄기</button>
  <button id="themeToggle">🌙 다크 모드</button>

  <main>
    <!-- ⬆ 기존 모든 콘텐츠 그대로 유지 (내용은 생략) -->
  </main>

  <script>
    function showPage(num) {
      document.querySelectorAll('.page-section').forEach(section => {
        section.classList.remove('active');
      });
      const target = document.getElementById('page' + num);
      if (target) target.classList.add('active');
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    (function() {
      const body = document.body;
      const themeToggle = document.getElementById('themeToggle');
      const musicToggle = document.getElementById('musicToggle');
      const bgm = document.getElementById('bgm');

      /* 🌙 다크모드 복원 */
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        body.classList.add('dark');
        themeToggle.textContent = '☀️ 라이트 모드';
      } else {
        themeToggle.textContent = '🌙 다크 모드';
      }

      themeToggle.addEventListener('click', () => {
        body.classList.toggle('dark');
        const isDark = body.classList.contains('dark');
        themeToggle.textContent = isDark ? '☀️ 라이트 모드' : '🌙 다크 모드';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });

      /* 🎵 자동 재생 + 부드러운 fade-in */
      function tryAutoPlay() {
        if (!bgm) return;
        bgm.volume = 0;

        bgm.play().then(() => {
          setTimeout(() => {
            let v = 0;
            const fade = setInterval(() => {
              v += 0.05;
              bgm.volume = Math.min(v, 0.7);
              if (v >= 0.7) clearInterval(fade);
            }, 120);
          }, 500);
        }).catch(err => {
          console.log("자동재생 차단됨:", err);
        });
      }

      document.addEventListener('DOMContentLoaded', tryAutoPlay);

      /* 🎵 음악 토글 버튼 */
      let musicOn = true;
      musicToggle.textContent = '🔈 음악 끄기';

      musicToggle.addEventListener('click', () => {
        musicOn = !musicOn;
        if (musicOn) {
          bgm.play();
          musicToggle.textContent = '🔈 음악 끄기';
        } else {
          bgm.pause();
          musicToggle.textContent = '🔇 음악 켜기';
        }
      });

    })();
  </script>
</body>
</html>
